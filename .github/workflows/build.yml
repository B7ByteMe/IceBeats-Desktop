name: Build IceBeats Windows

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Inject Supabase & Env Config
      shell: bash
      run: |
        echo "SUPABASE_URL=https://jiytrtynlucsbbjpbybr.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppeXRydHlubHVjc2JianBieWJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDg4ODQsImV4cCI6MjEwNDk4NDg4NH0.BQQVZ8GghQqGIHPpUWx9n3VKc8Vqx0gQfDjYR2fEhDo" >> .env
        echo "AUTH_API_BASE_URL=https://jiytrtynlucsbbjpbybr.supabase.co" >> .env

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Python backend with PyInstaller
      run: |
        pyinstaller --name server --onedir --noconsole --add-data "templates;templates" --add-data "static;static" --collect-data ytmusicapi -y app.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: electron-app/package-lock.json

    - name: Sync Version from Tag (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ./electron-app
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        VERSION_NAME="${TAG_NAME#v}"
        echo "Detected tag: $TAG_NAME, injecting version: $VERSION_NAME into package.json"
        node -e "let pkg=require('./package.json'); pkg.version='$VERSION_NAME'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

    - name: Install Node dependencies
      working-directory: ./electron-app
      run: npm install

    - name: Build Windows Installer & Portable (.exe)
      working-directory: ./electron-app
      run: npx electron-builder --win --publish never

    - name: Upload Windows Artifacts (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: IceBeats-Windows-EXE
        path: |
          electron-app/dist/*.exe

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
        name: IceBeats Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
        files: |
          electron-app/dist/*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
